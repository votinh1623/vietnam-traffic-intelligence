# botsort_custom.yaml
# Same thresholds as bytetrack_custom.yaml so this run isolates the
# BoT-SORT association/Kalman-filter algorithm change from ByteTrack,
# with ReID still disabled. Compare against botsort_reid_custom.yaml to
# isolate the ReID contribution on top of this.
tracker_type: botsort
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 60
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow

proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
