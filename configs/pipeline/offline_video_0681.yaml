schema_version: 1

# WP1 demo config #1 of 2 (see manifests/measurement/video_0681.yaml and
# reports/ke-hoach-pipeline-va-mo-phong.md Gate G1: "chạy end-to-end trên
# ít nhất hai video UAV khác đặc tính"). Same locked tracker/analytics
# profile as configs/pipeline/offline_video.yaml -- only source and
# measurement_manifest differ.
source: "datasets/raw_videos/FDown.vn_Tai_video_Facebook_720p (HD)_0681.mp4"
model: runs/detect/research/yolov8s_v5_seed0/weights/best.pt
measurement_manifest: manifests/measurement/video_0681.yaml

perception:
  confidence: 0.4
  iou: 0.7
  max_det: 300
  show_labels: true
  show_confidence: true
  device: "0"
  tracker: botsort_reid_lowprox.yaml

video:
  codec: mp4v
  fallback_fps: 30.0
  max_frames: null

output:
  root: output/pipeline

evidence:
  enabled: true
  keyframe_event_types: [line_crossing, congestion_transition, prolonged_stop]
  clip_event_types: [congestion_transition, prolonged_stop]
  pre_event_s: 2
  post_event_s: 3
  jpeg_quality: 90
  clip_codec: mp4v
  multi_view_enabled: true
  event_crop_padding_ratio: 0.25

analytics:
  enabled: true
  included_classes: [bus, car, motorcycle, truck]
  roi_polygon:
    - [0.48, 0.05]
    - [0.62, 0.05]
    - [0.84, 0.95]
    - [0.30, 0.95]
  counting_line:
    - [0.32, 0.65]
    - [0.78, 0.65]
  line_tolerance_px: 8
  trajectory_history: 30
  occupancy_grid_size_px: 1
  abnormal:
    prolonged_stop_enabled: true
    prolonged_stop_classes: [bus, car, motorcycle, truck]
    prolonged_stop_max_drift_body_lengths: 0.35
    prolonged_stop_release_drift_body_lengths: 0.7
    prolonged_stop_min_duration_s: 5
    prolonged_stop_max_gap_s: 1
  congestion:
    dense_enter_bbox_union_occupancy: 0.30
    dense_exit_bbox_union_occupancy: 0.25
    congested_enter_bbox_union_occupancy: 0.50
    congested_exit_bbox_union_occupancy: 0.40
    dense_enter_count: 45
    dense_exit_count: 40
    congested_enter_count: 50
    congested_exit_count: 45
    congested_max_speed_px_s: 150
    congested_release_speed_px_s: 170
    transition_confirm_s: 2
    release_confirm_s: 4
