schema_version: 1

# Visual-only heatmap demo for analytics stillness (see
# src/vn_traffic/analytics/stillness.py's stalled_dense_score/
# StillnessHeatmapRenderer). Independent of analytics.stillness_enabled
# (the state-machine trigger, which does not yet reliably escalate to
# CONGESTED on this clip). This renders a per-frame heatmap onto
# annotated.mp4 using a frame-relative threshold, validated to spatially
# localize the same clip's gridlocked motorcycle mass the detector draws
# zero boxes over.
source: datasets/raw_videos/YTDown.com_YouTube_Rush-Hour-Traffic-with-motorcycle-in-Ho-_Media_1ZupwFOhjl4_001_1080p.mp4
model: runs/detect/research/yolov8s_v5_seed0/weights/best.pt

perception:
  confidence: 0.4
  iou: 0.7
  max_det: 300
  show_labels: true
  show_confidence: true
  device: "0"
  tracker: botsort_reid_lowprox.yaml

video:
  codec: mp4v
  fallback_fps: 30.0
  max_frames: 900

output:
  root: output/pipeline

evidence:
  enabled: false

analytics:
  enabled: true
  included_classes: [bus, car, motorcycle, truck]
  roi_polygon:
    - [0.0, 0.0]
    - [1.0, 0.0]
    - [1.0, 1.0]
    - [0.0, 1.0]
  counting_line:
    - [0.0, 0.5]
    - [1.0, 0.5]

stillness_heatmap:
  enabled: true
  downscale: 4
  cell_px: 8
  motion_threshold: 1.0
  texture_percentile: 85.0
  alpha_max: 0.5
  smoothing_decay: 0.95
