schema_version: 1

# Both paths can be overridden from the CLI. The default is the validation-
# selected v5 checkpoint; the locked test has not been used for selection.
source: datasets/raw_videos/traffic_normal.mp4
model: runs/detect/research/yolov8s_v5_seed0/weights/best.pt

perception:
  imgsz: 1280
  confidence: 0.4
  iou: 0.7
  device: "0"
  tracker: bytetrack_custom.yaml

video:
  codec: mp4v
  fallback_fps: 30.0
  max_frames: null

output:
  root: output/pipeline

# Initial demo-calibrated geometry and thresholds. They are normalized/configurable
# defaults, not production calibration for a new camera or viewpoint.
analytics:
  enabled: true
  roi_polygon:
    - [0.48, 0.05]
    - [0.62, 0.05]
    - [0.84, 0.95]
    - [0.30, 0.95]
  counting_line:
    - [0.32, 0.65]
    - [0.78, 0.65]
  line_tolerance_px: 8
  trajectory_history: 30
  occupancy_grid_size_px: 1
  congestion:
    dense_enter_bbox_union_occupancy: 0.30
    dense_exit_bbox_union_occupancy: 0.25
    congested_enter_bbox_union_occupancy: 0.50
    congested_exit_bbox_union_occupancy: 0.40
    dense_enter_count: 45
    dense_exit_count: 40
    congested_enter_count: 50
    congested_exit_count: 45
    congested_max_speed_px_s: 150
    congested_release_speed_px_s: 170
    transition_confirm_s: 2
    release_confirm_s: 4
