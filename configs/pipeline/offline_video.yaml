schema_version: 1

# Both paths can be overridden from the CLI.
source: datasets/raw_videos/traffic_normal.mp4
model: runs/detect/research/yolov8s_v5_seed0/weights/best.pt

perception:
  # imgsz and line_width omitted -- both default to auto (adaptive to
  # source resolution, see vn_traffic.sizing) so inference detail and label
  # legibility both hold up on any input resolution instead of values
  # tuned to one specific video.
  # 0.1, not 0.4: BoT-SORT/ByteTrack uses detections between
  # track_low_thresh (0.1) and track_high_thresh (0.4) for its second
  # association pass, which sustains an EXISTING track through a frame
  # where the detector wavers. Setting this to 0.4 discarded that whole
  # band before the tracker ever saw it, leaving track_low_thresh dead --
  # measured on run89: 50% of surviving detections sat in 0.40-0.50, and
  # 16 of 19 mid-frame track deaths had no detection at all afterwards
  # (detector dropout, not an ID switch). New tracks still require
  # >= new_track_thresh (0.4), so the weak band can only extend existing
  # tracks, never invent one. Measured effect (run89 -> run99, same 500
  # frames): track rows 1591 -> 3183, median track life 1.6s -> 2.3s,
  # p75 3.5s -> 6.3s, mid-frame breaks 19 -> 13, border exits unchanged
  # at 18.
  confidence: 0.1
  iou: 0.7
  max_det: 300
  show_labels: true
  show_confidence: true
  device: "0"
  # BoT-SORT+ReID, not ByteTrack: measurably fewer ID switches than
  # ByteTrack in dense scenes, and ReID's occlusion-crossing ID retention
  # was chosen by direct visual review over an automated proxy metric that
  # disagreed -- see botsort_reid_lowprox.yaml for the proximity_thresh
  # reasoning.
  tracker: botsort_reid_lowprox.yaml

video:
  codec: mp4v
  fallback_fps: 30.0
  max_frames: null

output:
  root: output/pipeline

# Deterministic raw evidence for later VLM/LLM stages. Every event receives a
# keyframe; only congestion transitions receive a temporal clip by default.
evidence:
  enabled: true
  keyframe_event_types: [line_crossing, congestion_transition, prolonged_stop]
  clip_event_types: [congestion_transition, prolonged_stop]
  pre_event_s: 2
  post_event_s: 3
  jpeg_quality: 90
  clip_codec: mp4v

# Initial demo-calibrated geometry and thresholds. They are normalized/configurable
# defaults, not production calibration for a new camera or viewpoint.
analytics:
  enabled: true
  included_classes: [bus, car, motorcycle, truck]
  roi_polygon:
    - [0.48, 0.05]
    - [0.62, 0.05]
    - [0.84, 0.95]
    - [0.30, 0.95]
  counting_line:
    - [0.32, 0.65]
    - [0.78, 0.65]
  line_tolerance_px: 8
  trajectory_history: 30
  occupancy_grid_size_px: 1
  abnormal:
    prolonged_stop_enabled: true
    prolonged_stop_classes: [bus, car, motorcycle, truck]
    prolonged_stop_max_drift_body_lengths: 0.35
    prolonged_stop_release_drift_body_lengths: 0.7
    prolonged_stop_min_duration_s: 5
    prolonged_stop_max_gap_s: 1
  congestion:
    dense_enter_bbox_union_occupancy: 0.30
    dense_exit_bbox_union_occupancy: 0.25
    congested_enter_bbox_union_occupancy: 0.50
    congested_exit_bbox_union_occupancy: 0.40
    dense_enter_count: 45
    dense_exit_count: 40
    congested_enter_count: 50
    congested_exit_count: 45
    congested_max_speed_px_s: 150
    congested_release_speed_px_s: 170
    transition_confirm_s: 2
    release_confirm_s: 4
