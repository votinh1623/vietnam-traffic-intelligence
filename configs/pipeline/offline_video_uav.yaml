schema_version: 1

# UAV / moving-camera profile (Option A fix for the ROI-misplacement failure
# documented in experiments/uav_pipeline_e2e_v1_20260818: a hand-drawn
# ground-anchored ROI, calibrated on the fixed-camera clips, points at the
# wrong region within seconds once the camera pans or zooms). analytics.mode
# below defaults the analytics region to the full frame instead of a polygon.
# This is not camera-motion compensation (no GMC/homography); it only avoids
# anchoring to a stale patch of ground. Occupancy still shifts with zoom.
#
# Detector: the VisDrone 10-class baseline, not the Vietnam v5 checkpoint,
# matching the model already selected for the VisDrone-MOT tracking/counting
# benchmarks and the run25 end-to-end UAV benchmark -- v5 was fine-tuned on
# low-altitude ground-camera scenes and is not assumed to generalize to
# aerial framing.
source: datasets/raw_videos/YTSave_YouTube_AERIAL-DRONE-4K-VIDEO-CITY-TRAFFIC-JAM-P_Media_Sk1ZAIQc7ZM_001_1080p.mp4
model: runs/detect/baseline/yolov8s_visdrone/weights/best.pt

perception:
  imgsz: 1280
  confidence: 0.1
  iou: 0.7
  max_det: 1000
  show_labels: true
  show_confidence: true
  line_width: 2
  device: "0"
  tracker: bytetrack_custom.yaml

video:
  codec: mp4v
  fallback_fps: 30.0
  max_frames: 300

output:
  root: output/pipeline

evidence:
  enabled: false

# Thresholds are carried over unchanged from the fixed-camera profile as a
# starting point only. They were calibrated on a small ground-camera ROI and
# have not been re-selected for full-frame UAV occupancy; expect to revisit
# them after inspecting a real run's occupancy/count distribution.
analytics:
  mode: uav_motion
  included_classes:
    - bicycle
    - bus
    - car
    - motor
    - motorcycle
    - truck
    - van
    - tricycle
    - awning-tricycle
  line_tolerance_px: 8
  trajectory_history: 30
  occupancy_grid_size_px: 1
  congestion:
    dense_enter_bbox_union_occupancy: 0.30
    dense_exit_bbox_union_occupancy: 0.25
    congested_enter_bbox_union_occupancy: 0.50
    congested_exit_bbox_union_occupancy: 0.40
    dense_enter_count: 45
    dense_exit_count: 40
    congested_enter_count: 50
    congested_exit_count: 45
    congested_max_speed_px_s: 150
    congested_release_speed_px_s: 170
    transition_confirm_s: 2
    release_confirm_s: 4
