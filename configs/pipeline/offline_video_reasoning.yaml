schema_version: 1

# Public full-pipeline config: same defaults as offline_video.yaml, plus
# reasoning.enabled: true. No source video or per-video measurement manifest
# is committed. Always pass local --source and --model paths on the CLI; see
# docs/quickstart.md.
source: <video_path>
model: runs/detect/research/yolov8s_v6_seed0-2/weights/best.pt

perception:
  confidence: 0.1
  iou: 0.7
  max_det: 300
  show_labels: true
  show_confidence: true
  device: "0"
  tracker: botsort_reid_lowprox.yaml

video:
  codec: mp4v
  fallback_fps: 30.0
  max_frames: null

output:
  root: output/pipeline

evidence:
  enabled: true
  visual_scan_enabled: true
  visual_scan_interval_s: 5.0
  keyframe_event_types: [visual_scan, line_crossing, congestion_transition, prolonged_stop]
  clip_event_types: [visual_scan, congestion_transition, prolonged_stop]
  pre_event_s: 2
  post_event_s: 3
  jpeg_quality: 90
  clip_codec: mp4v

analytics:
  enabled: true
  included_classes: [bus, car, motorcycle, truck]
  roi_polygon:
    - [0.48, 0.05]
    - [0.62, 0.05]
    - [0.84, 0.95]
    - [0.30, 0.95]
  counting_line:
    - [0.32, 0.65]
    - [0.78, 0.65]
  line_tolerance_px: 8
  trajectory_history: 30
  occupancy_grid_size_px: 1
  abnormal:
    prolonged_stop_enabled: true
    prolonged_stop_classes: [bus, car, motorcycle, truck]
    prolonged_stop_max_drift_body_lengths: 0.35
    prolonged_stop_release_drift_body_lengths: 0.7
    prolonged_stop_min_duration_s: 5
    prolonged_stop_max_gap_s: 1
  congestion:
    dense_enter_bbox_union_occupancy: 0.30
    dense_exit_bbox_union_occupancy: 0.25
    congested_enter_bbox_union_occupancy: 0.50
    congested_exit_bbox_union_occupancy: 0.40
    dense_enter_count: 45
    dense_exit_count: 40
    congested_enter_count: 50
    congested_exit_count: 45
    congested_max_speed_px_s: 150
    congested_release_speed_px_s: 170
    transition_confirm_s: 2
    release_confirm_s: 4

reasoning:
  enabled: true
  scope: event
  event_types: [visual_scan, congestion_transition, prolonged_stop]
  prompts: prompts_v9.yaml
  vlm_model_dir: models/qwen3-vl-2b-instruct
  llm_model_dir: models/qwen3-0.6b
  vlm:
    model_id: Qwen/Qwen3-VL-2B-Instruct
    revision: 89644892e4d85e24eaac8bacfd4f463576704203
    dtype: float16
    clip_sample_frames: 3
    max_new_tokens: 384
  llm:
    model_id: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    dtype: float16
    thinking: false
    max_new_tokens: 512
  generation:
    do_sample: true
    seed: 0
    max_attempts: 3
