schema_version: 1

# Does confidence=0.1 alone (fixed_camera mode, occupancy corroboration
# intact -- NOT the uav_motion count-bypass that just proved unsafe) avoid
# the false positive on traffic_normal.mp4?
source: datasets/raw_videos/traffic_normal.mp4
model: runs/detect/research/yolov8s_v5_seed0/weights/best.pt

perception:
  imgsz: 1280
  confidence: 0.1
  iou: 0.7
  max_det: 1000
  show_labels: true
  show_confidence: true
  line_width: 2
  device: "0"
  tracker: bytetrack_custom.yaml

video:
  codec: mp4v
  fallback_fps: 30.0
  max_frames: 300

output:
  root: output/pipeline

evidence:
  enabled: false

analytics:
  enabled: true
  included_classes: [bus, car, motorcycle, truck]
  roi_polygon:
    - [0.0, 0.0]
    - [1.0, 0.0]
    - [1.0, 1.0]
    - [0.0, 1.0]
  counting_line:
    - [0.0, 0.5]
    - [1.0, 0.5]
