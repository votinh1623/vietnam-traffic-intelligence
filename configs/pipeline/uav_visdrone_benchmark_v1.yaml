schema_version: 1

# Bounded end-to-end product benchmark on a real moving-camera UAV clip. The
# first 300 frames are used so the exact processed span is reproducible.
source: datasets/raw_videos/YTSave_YouTube_AERIAL-DRONE-4K-VIDEO-CITY-TRAFFIC-JAM-P_Media_Sk1ZAIQc7ZM_001_1080p.mp4
model: runs/detect/baseline/yolov8s_visdrone/weights/best.pt

perception:
  imgsz: 1280
  confidence: 0.1
  iou: 0.7
  max_det: 1000
  device: "0"
  tracker: bytetrack_custom.yaml

video:
  codec: mp4v
  fallback_fps: 30.0
  max_frames: 300

output:
  root: output/pipeline

# Avoid exporting a keyframe for every image-space crossing in a moving-camera
# clip. Congestion/stop evidence remains enabled to exercise the exporter.
evidence:
  enabled: true
  keyframe_event_types: [congestion_transition, prolonged_stop]
  clip_event_types: [congestion_transition, prolonged_stop]
  pre_event_s: 2
  post_event_s: 3
  jpeg_quality: 90
  clip_codec: mp4v

# Hand-set image-space geometry for the first 300-frame span only. Camera
# zoom/pan means line-crossing and occupancy values are not accuracy evidence.
analytics:
  enabled: true
  roi_polygon:
    - [0.00, 0.47]
    - [0.47, 0.40]
    - [0.47, 0.00]
    - [0.63, 0.00]
    - [0.62, 0.42]
    - [1.00, 0.42]
    - [1.00, 0.70]
    - [0.64, 0.62]
    - [0.70, 1.00]
    - [0.52, 1.00]
    - [0.53, 0.68]
    - [0.00, 0.78]
  counting_line:
    - [0.05, 0.64]
    - [0.44, 0.58]
  line_tolerance_px: 8
  trajectory_history: 30
  occupancy_grid_size_px: 1
  abnormal:
    prolonged_stop_enabled: true
    prolonged_stop_classes: [bicycle, bus, car, motor, truck, van]
    prolonged_stop_max_speed_px_s: 5
    prolonged_stop_release_speed_px_s: 10
    prolonged_stop_min_duration_s: 5
    prolonged_stop_max_gap_s: 1
  congestion:
    dense_enter_bbox_union_occupancy: 0.30
    dense_exit_bbox_union_occupancy: 0.25
    congested_enter_bbox_union_occupancy: 0.50
    congested_exit_bbox_union_occupancy: 0.40
    dense_enter_count: 45
    dense_exit_count: 40
    congested_enter_count: 50
    congested_exit_count: 45
    congested_max_speed_px_s: 150
    congested_release_speed_px_s: 170
    transition_confirm_s: 2
    release_confirm_s: 4
