  # degenerating into diacritic-free, non-grounded text regardless of
  # prompt wording (v4/v5) -- see prompts_v5.yaml's note. Sampling lets
  # run_vlm_case retry with a fresh seed on validator failure instead of
  # deterministically replaying the same bad output every time.
  do_sample: true
  seed: 0
  max_attempts: 3
