schema_version: 1
benchmark_id: counting_visdrone_mot_v1

dataset:
  root: datasets/VisDrone/VisDrone2019-MOT-val
  sequences_dir: sequences
  annotations_dir: annotations
  sequences:
    - uav0000117_02622_v
    - uav0000137_00458_v
    - uav0000182_00000_v
    - uav0000268_05773_v
    - uav0000305_00000_v
    - uav0000339_00001_v
  excluded_sequences:
    uav0000086_00000_v: basketball-court scene without a traffic roadway
  class_map:
    3: bicycle
    4: car
    5: van
    6: truck
    7: tricycle
    8: awning-tricycle
    9: bus
    10: motor

candidates:
  standard_640:
    predictions_dir: benchmark_outputs/tracking_visdrone_mot_standard640_v1/predictions
    run_record: benchmark_outputs/tracking_visdrone_mot_standard640_v1/run.json
    expected_run_sha256: 8e4bffecbc213d8cd8f4f22f2729f91ffe3d727a4b8d89fc8099ccf4e0d3d49d
  standard_1280:
    predictions_dir: benchmark_outputs/tracking_visdrone_mot_selected_v1/predictions
    run_record: benchmark_outputs/tracking_visdrone_mot_selected_v1/run.json
    expected_run_sha256: c03dd9d2e82cc159d96968403ad7003050794b23f964196bfdbacd50a48a1d18

counting:
  normalized_horizontal_lines: [0.35, 0.50, 0.65]
  line_tolerance_px: 4.0
  occupancy_grid_size_px: 32

evaluation:
  output_root: benchmark_outputs/counting_visdrone_mot_v1
  require_clean_worktree: true
  claim_boundary: >-
    Vehicle-count comparison against native VisDrone MOT trajectories on six
    traffic sequences. Frame-count error is directly interpretable in image
    space. Line-crossing error exercises the production state machine at three
    frozen normalized lines, but moving UAV cameras mean it is not a physical
    road-flow measurement and no BEV or camera-motion compensation is applied.
