schema_version: 1
study_id: tvlr_oracle_visdrone_mot_v1

scope:
  execution: offline_only
  claim_boundary: >-
    Development-only oracle upper bound on post-NMS low-confidence proposals.
    It uses GT identity for temporal-support analysis, is not achieved model
    performance, and does not support a real-time claim.

dataset:
  root: datasets/VisDrone/VisDrone2019-MOT-val
  sequences_dir: sequences
  annotations_dir: annotations
  development_sequences:
    - uav0000117_02622_v
    - uav0000182_00000_v
    - uav0000305_00000_v
  internal_holdout_sequences:
    - uav0000137_00458_v
    - uav0000268_05773_v
    - uav0000339_00001_v
  excluded_sequences:
    uav0000086_00000_v: basketball-court scene outside the traffic-counting claim
  class_map:
    3: bicycle
    4: car
    5: van
    6: truck
    7: tricycle
    8: awning-tricycle
    9: bus
    10: motor

model:
  weights: runs/detect/baseline/yolov8s_visdrone/weights/best.pt
  expected_sha256: 0e0b3812e2d8e7821458c33761f4997cda1a536bac56c96e119ea02f0330fe08
  expected_classes: [pedestrian, people, bicycle, car, van, truck, tricycle, awning-tricycle, bus, motor]
  evaluation_classes: [bicycle, car, van, truck, tricycle, awning-tricycle, bus, motor]

proposal_export:
  imgsz: 1280
  confidence: 0.02
  iou: 0.7
  max_det: 3000
  device: "0"
  output_root: benchmark_outputs/tvlr_proposals_dev_v1
  fail_on_saturated_frame: true

bytetrack_baseline:
  predictions_dir: benchmark_outputs/tracking_visdrone_mot_selected_v1/predictions
  run_record: benchmark_outputs/tracking_visdrone_mot_selected_v1/run.json
  expected_run_sha256: c03dd9d2e82cc159d96968403ad7003050794b23f964196bfdbacd50a48a1d18
  track_low_thresh: 0.1
  track_high_thresh: 0.5

oracle:
  iou_threshold: 0.5
  temporal_windows: [1, 3, 5]
  tiny_max_sqrt_area_px: 16.0
  occluded_min_level: 1
  output_root: benchmark_outputs/tvlr_oracle_dev_v1

gates:
  incremental_candidate_fraction_tiny_or_occluded_min: 0.15
  oracle_detection_recall_absolute_gain_min: 0.02
  oracle_frame_count_wape_relative_reduction_min: 0.05
  require_nonzero_temporal_support: true
