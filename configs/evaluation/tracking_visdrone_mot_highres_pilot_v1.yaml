schema_version: 1
benchmark_id: tracking_visdrone_mot_highres_pilot_v1

dataset:
  root: datasets/VisDrone/VisDrone2019-MOT-val
  sequences_dir: sequences
  annotations_dir: annotations
  # Vehicle categories only; pedestrian/people are outside the project target.
  class_map:
    3: bicycle
    4: car
    5: van
    6: truck
    7: tricycle
    8: awning-tricycle
    9: bus
    10: motor

model:
  weights: runs/detect/research/yolov8s_visdrone_highres_ft_v1_20260821T105030/weights/best.pt
  expected_sha256: a9bd5c8382f33a7b7b0aabed6dfdbe0a9f6e5443d531d9c0c8b8e3dcf59e8483
  expected_classes: [pedestrian, people, bicycle, car, van, truck, tricycle, awning-tricycle, bus, motor]
  evaluation_classes: [bicycle, car, van, truck, tricycle, awning-tricycle, bus, motor]

perception:
  imgsz: 1280
  confidence: 0.1
  iou: 0.7
  max_det: 1000
  device: "0"
  tracker: bytetrack_custom.yaml

evaluation:
  metric_iou_threshold: 0.5
  sequences: all
  output_root: benchmark_outputs/tracking_visdrone_mot_highres_pilot_v1
  require_clean_worktree: true
  claim_boundary: >-
    Identical protocol to tracking_visdrone_mot_selected_v1.yaml (standard-1280,
    ByteTrack, same eight vehicle classes, confidence 0.1), but using the
    yolov8s_visdrone_highres_ft_v1 pilot checkpoint (5-epoch native-1280
    continuation) instead of the 640-trained baseline, to check whether the
    pilot's detection AP gain propagates into tracking metrics. Not an
    official VisDrone benchmark; no ignore-region handling or HOTA.
