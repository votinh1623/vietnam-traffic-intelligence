experiment:
  id: yolov8s_v6_seed0
  purpose: >-
    add UIT-ADrone nadir (90deg), motorcycle-dense sample to fix measured
    weaknesses in yolov8s_v5_seed0: poor recall and car/truck confusion at
    near-nadir UAV angles (see reports on run88/run3/run97). Trains from
    the same VisDrone base as v5 in one pass over the union of v5's train
    set and the new sample, rather than continuing from the v5 checkpoint,
    to avoid catastrophic forgetting of either regime.
  status: proposed

model:
  architecture: yolov8s
  weights: runs/detect/baseline/yolov8s_visdrone/weights/best.pt
  initialization: coco_to_visdrone_best_epoch_74

dataset:
  data_yaml: datasets/vietnam_dataset_v5/data_plus_uit_adrone.yaml
  materialization_manifest: datasets/vietnam_dataset_v5/manifest.csv
  audit_report: manifests/datasets/vietnam_v5/audit.json
  test_lock: manifests/datasets/vietnam_v5/test_lock.json
  test_lock_sha256: 6a9c275059591b7a1ae410b6a813e9c2041beac068801a37e44db5d432ebc1d3
  selection_split: validation
  forbidden_selection_split: test

train:
  epochs: 30
  patience: 15
  imgsz: 1280
  batch: 4
  device: 0
  workers: 0
  optimizer: AdamW
  lr0: 0.0005
  weight_decay: 0.0005
  freeze: 0
  seed: 0
  deterministic: true
  amp: true
  cache: false
  mosaic: 1.0
  mixup: 0.3
  close_mosaic: 10
  plots: true
  save: true
  val: true
  project: runs/detect/research
  name: yolov8s_v6_seed0
  exist_ok: false

provenance:
  require_git_commit: true
  require_clean_worktree: true
  output_root: experiments
