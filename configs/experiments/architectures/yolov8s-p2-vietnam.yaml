# Project-owned copy of Ultralytics' yolov8-p2.yaml (AGPL-3.0, from
# ultralytics/cfg/models/v8/yolov8-p2.yaml in the pinned 8.4.115 install),
# with nc set to this project's 5 Vietnamese traffic classes instead of
# COCO's 80. Backbone (layers 0-9) is byte-identical to the plain
# yolov8.yaml this project's checkpoints were trained on, so most backbone
# weights transfer from an existing .pt checkpoint via YOLO(this).load(pt);
# the head differs (adds a P2/4 branch and a 4th Detect scale) and is
# initialized fresh. See docs/benchmark_protocol.md "P2 detection head"
# for why: the plain 3-head model (stride 8/16/32) has no output whose
# receptive field is sized for objects a few pixels wide, which is most of
# this project's locked-test box-size distribution.
#
# Filename keeps the literal "yolov8s" substring on purpose: Ultralytics
# resolves model scale (n/s/m/l/x) from cfg/tasks.py's guess_model_scale()
# regex over the filename, not a separate argument.

nc: 5 # bus, car, motorcycle, pedestrian, truck (see datasets/vietnam_dataset_v5/data.yaml)
scales: # model compound scaling constants, i.e. 'model=yolov8n-p2.yaml' will call yolov8-p2.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0-p2 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 3, C2f, [128]] # 18 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]] # cat head P3
  - [-1, 3, C2f, [256]] # 21 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 24 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f, [1024]] # 27 (P5/32-large)

  - [[18, 21, 24, 27], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
