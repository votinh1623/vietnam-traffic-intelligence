schema_version: 1

experiment:
  id: yolov8s_visdrone_highres_ft_v1
  purpose: >-
    Direct small-object detector pilot: continue the selected VisDrone
    YOLOv8s checkpoint at 1280 after its original 640 training, without
    mosaic shrinking objects back into 640-scale quadrants.
  scope: validation_only_pilot

model:
  weights: runs/detect/baseline/yolov8s_visdrone/weights/best.pt
  expected_sha256: 0e0b3812e2d8e7821458c33761f4997cda1a536bac56c96e119ea02f0330fe08
  initialization: selected_visdrone_640_checkpoint

dataset:
  data_yaml: VisDrone.yaml
  selection_split: val
  forbidden_split: test
  expected_train_images: 6471
  expected_val_images: 548

train:
  epochs: 5
  patience: 5
  imgsz: 1280
  batch: 2
  device: 0
  workers: 0
  optimizer: AdamW
  lr0: 0.0002
  lrf: 0.1
  weight_decay: 0.0005
  warmup_epochs: 1.0
  cos_lr: true
  freeze: 0
  seed: 0
  deterministic: true
  amp: true
  cache: false
  mosaic: 0.0
  mixup: 0.0
  close_mosaic: 0
  translate: 0.05
  scale: 0.2
  fliplr: 0.5
  plots: true
  save: true
  val: true
  project: runs/detect/research
  name: yolov8s_visdrone_highres_ft_v1
  exist_ok: false

gates:
  baseline_coco_ap: 0.2635331994601399
  baseline_coco_ap_small: 0.19380973711353866
  ap_small_absolute_gain_min: 0.01
  overall_ap_absolute_drop_max: 0.005
  note: >-
    Evaluate the selected pilot checkpoint once with the existing frozen
    COCO-style VisDrone-DET-val evaluator. Do not alter these gates after
    observing pilot results.

provenance:
  require_clean_worktree: true
  output_root: experiments
