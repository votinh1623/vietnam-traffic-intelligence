experiment:
  id: yolov8s_v5_seed0_nwd
  purpose: >-
    Same as yolov8s_v5_seed0 (leakage-controlled full fine-tuning on
    deduplicated Vietnamese traffic) but with the bbox regression loss
    blended with Normalized Wasserstein Distance (see
    scripts/train/nwd_loss.py) instead of pure CIoU, to test whether a
    loss that stays smooth for tiny boxes closes some of the
    validation-to-locked-test generalization gap documented for
    yolov8s_v5_seed0 (mAP50 0.600 val vs 0.148 locked test, driven by an
    object-scale shift).
  status: proposed

model:
  architecture: yolov8s
  weights: runs/detect/baseline/yolov8s_visdrone/weights/best.pt
  initialization: coco_to_visdrone_best_epoch_74

dataset:
  data_yaml: datasets/vietnam_dataset_v5/data.yaml
  materialization_manifest: datasets/vietnam_dataset_v5/manifest.csv
  audit_report: manifests/datasets/vietnam_v5/audit.json
  test_lock: manifests/datasets/vietnam_v5/test_lock.json
  test_lock_sha256: 6a9c275059591b7a1ae410b6a813e9c2041beac068801a37e44db5d432ebc1d3
  selection_split: validation
  forbidden_selection_split: test

# alpha blends NWD similarity with CIoU (0 = pure CIoU / unchanged
# baseline behavior, 1 = pure NWD); 0.5 is an untuned starting point, not
# a selected value. constant (C) is the Wasserstein-to-similarity scale:
# 16 is the pixel-space median sqrt(w*h) of the LOCKED TEST split at
# imgsz=1280 (measured directly from datasets/vietnam_dataset_v5/test/labels,
# not the AI-TOD paper's default of 12.8), i.e. tuned to the box scale this
# experiment is specifically trying to generalize to -- not fit to it via
# training, since the locked test is still never used for selection.
loss_patch:
  type: nwd
  alpha: 0.5
  constant: 16.0

train:
  epochs: 30
  patience: 15
  imgsz: 1280
  batch: 4
  device: 0
  workers: 0
  optimizer: AdamW
  lr0: 0.0005
  weight_decay: 0.0005
  freeze: 0
  seed: 0
  deterministic: true
  amp: true
  cache: false
  mosaic: 1.0
  mixup: 0.3
  close_mosaic: 10
  plots: true
  save: true
  val: true
  project: runs/detect/research
  name: yolov8s_v5_seed0_nwd
  exist_ok: false

provenance:
  require_git_commit: true
  require_clean_worktree: true
  output_root: experiments
