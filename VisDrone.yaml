# VisDrone.yaml – cấu hình dataset nội bộ

path: C:/Workspace - Copy/cv/datasets/VisDrone  # Đường dẫn gốc tới thư mục dữ liệu
train: VisDrone2019-DET-train/images            # ảnh train (tương đối so với path)
val: VisDrone2019-DET-val/images                # ảnh val

# Số lớp và tên lớp của VisDrone
nc: 10
names: ['pedestrian', 'people', 'bicycle', 'car', 'van', 'truck', 'tricycle', 'awning-tricycle', 'bus', 'motor']

# (Tùy chọn) Nếu bạn muốn tự động convert annotation từ XML sang YOLO:
# Ultralytics sẽ tự làm nếu nó tìm thấy thư mục "annotations" bên trong mỗi thư mục train/val.