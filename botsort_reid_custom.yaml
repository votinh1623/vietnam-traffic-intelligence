# botsort_reid_custom.yaml
# Identical to botsort_custom.yaml except with_reid is enabled. model:auto
# reuses the detector's own pre-Detect-head features as the appearance
# embedding (Ultralytics 8.4.115 ultralytics/trackers/utils/reid.py) --
# no separate ReID checkpoint is downloaded or trained.
tracker_type: botsort
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 60
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow

proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: auto
