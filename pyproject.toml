[project]
name = "vn-traffic-readiness"
version = "0.1.0"
description = "Leakage-controlled Vietnamese traffic monitoring and multi-model deployment-readiness research"
readme = "readme.md"
requires-python = ">=3.10,<3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python>=4.8,<6",
    "pandas>=2,<3",
    "PyYAML>=6,<7",
    "ultralytics>=8.3,<9",
    "motmetrics>=1.4,<2",
]

[project.scripts]
vn-traffic = "vn_traffic.cli:main"

[project.optional-dependencies]
# Deliberately left unpinned until the detector/VLM/LLM backends are selected.
# Installing an optional backend requires explicit approval and a recorded lock.
llm = []
vlm = []
deployment = []
tracking-eval = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
